<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<div id="chart"></div>
<script>
vegaEmbed('#chart', {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  width: 260, height: 160,
  data: { values: [{ name: '甲', value: 2 }, { name: '乙', value: 5 }] },
  mark: 'bar',
  encoding: { x: { field: 'name', type: 'nominal' }, y: { field: 'value', type: 'quantitative' } }
}, { actions: false, renderer: 'svg' }).then(function(result) {
  window.vegaResult = result;
  window.vegaDone = true;
});
</script>
</body></html>
