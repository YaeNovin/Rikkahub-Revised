<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview</title>

    <!-- KaTeX for LaTeX math rendering -->
    <link rel="stylesheet" href="https://rikkahub.local/assets/html/renderers/katex.min.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://rikkahub.local/assets/html/renderers/atom-one-dark.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: {{ON_BACKGROUND_COLOR}};
            max-width: 100%;
            margin: 0;
            padding: 16px;
            background: {{BACKGROUND_COLOR}};
        }

        /* Responsive design */
        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
                padding: 24px;
            }
        }

        /* Typography */
        h1 { margin-top: 24px; margin-bottom: 16px; font-weight: 600; line-height: 1.25; font-size: 2em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h2 { margin-top: 20px; margin-bottom: 14px; font-weight: 600; line-height: 1.25; font-size: 1.75em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h3 { margin-top: 18px; margin-bottom: 12px; font-weight: 600; line-height: 1.25; font-size: 1.5em; }
        h4 { margin-top: 16px; margin-bottom: 10px; font-weight: 600; line-height: 1.25; font-size: 1.25em; }
        h5 { margin-top: 14px; margin-bottom: 8px; font-weight: 600; line-height: 1.25; font-size: 1.1em; }
        h6 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; line-height: 1.25; font-size: 1em; color: {{ON_SURFACE_VARIANT_COLOR}}; }

        p {
            margin-bottom: 16px;
        }

        /* Code styling */
        code {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 3px;
            font-size: 85%;
            margin: 0;
            padding: 0.2em 0.4em;
            font-family: 'SF Mono', Monaco, Inconsolata, 'Roboto Mono', monospace;
        }

        pre {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 6px;
            font-size: 85%;
            line-height: 1.45;
            overflow: auto;
            padding: 16px;
            margin-bottom: 16px;
        }

        pre code {
            background: transparent;
            border: 0;
            display: inline;
            line-height: inherit;
            margin: 0;
            overflow: visible;
            padding: 0;
            word-wrap: normal;
        }

        /* Tables */
        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            margin-bottom: 16px;
        }

        table th, table td {
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
            padding: 6px 13px;
        }

        table th {
            background: {{SURFACE_VARIANT_COLOR}};
            font-weight: 600;
        }

        table tr:nth-child(2n) {
            background: {{SURFACE_VARIANT_COLOR}};
        }

        /* Lists */
        ul, ol {
            margin-bottom: 16px;
            padding-left: 2em;
        }

        li {
            margin-bottom: 4px;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid {{OUTLINE_VARIANT_COLOR}};
            color: {{ON_SURFACE_VARIANT_COLOR}};
            margin: 0 0 16px 0;
            padding: 0 16px;
        }

        /* Links */
        a {
            color: {{PRIMARY_COLOR}};
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px auto;
        }

        /* Keep every rendered media surface centered while retaining native
           WebView pinch zoom and scroll/pan behavior. */
        img, svg, video, canvas, iframe {
            display: block;
            max-width: 100%;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
        }

        /* Badge images retain their CSS dimensions and wrap as an inline row. */
        img[src*="img.shields.io/"], img[src*="badgen.net/"], img[src*="/badge.svg"] {
            display: inline-block; vertical-align: middle; border-radius: 0;
            margin: 2px 4px 2px 0; width: auto; height: auto; max-height: 40px;
        }

        /* Horizontal rules */
        hr {
            background: {{OUTLINE_VARIANT_COLOR}};
            border: 0;
            height: 1px;
            margin: 24px 0;
        }

        /* KaTeX math */
        .katex {
            font-size: 1.1em;
        }

        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
        }

        /* Mermaid diagrams */
        .mermaid {
            text-align: center;
            margin: 16px 0;
        }

        /* Task lists */
        .task-list-item {
            list-style-type: none;
        }

        .task-list-item input[type="checkbox"] {
            margin-right: 8px;
        }

        /* Theme colors are dynamically replaced by the Android app */
    </style>
</head>
<body>
    <div id="preview-status" role="status">正在排版…</div>
    <div id="content"><pre id="preview-fallback" style="white-space:pre-wrap;overflow-wrap:anywhere">{{MARKDOWN_FALLBACK}}</pre></div>
    <script>
      window.__rikkaRenderStatus = 'loading';
      window.rikkaPreviewFailure = function(error) {
        window.__rikkaRenderStatus = 'error';
        const status = document.getElementById('preview-status');
        status.hidden = false;
        status.textContent = '部分预览未能完成，已保留可读内容。可刷新重试。';
        console.error(error);
      };
      window.rikkaPreviewTimer = setTimeout(function() {
        if (window.__rikkaRenderStatus === 'loading') window.rikkaPreviewFailure(new Error('HTML preview timed out'));
      }, 20000);
    </script>
    <script src="https://rikkahub.local/assets/html/renderers/markdown-it.min.js"></script>
    <script src="https://rikkahub.local/assets/html/renderers/katex.min.js"></script>
    <script src="https://rikkahub.local/assets/html/renderers/mhchem.min.js"></script>
    <script src="https://rikkahub.local/assets/html/renderers/markdown-it-katex.js"></script>
    <script src="https://rikkahub.local/assets/html/renderers/markdown-it-task-lists.min.js"></script>
    <script src="https://rikkahub.local/assets/html/renderers/highlight.min.js"></script>
    <script src="https://rikkahub.local/assets/html/mermaid.min.js"></script>

    <script>
      (function() { try {
        // The same local KaTeX instance is used by the plugin and mhchem.
        if (!Array.prototype.at) Object.defineProperty(Array.prototype, 'at', { value: function(index) {
          index = Math.trunc(Number(index) || 0); return this[index < 0 ? this.length + index : index];
        }, configurable: true, writable: true });
        const MarkdownIt = window.markdownit;
        // UMD and ESM-to-UMD builds expose plugins differently. Accept both a direct function
        // and a { default } export so a WebView/library update cannot produce an avoidable
        // "...default is undefined" failure.
        const unwrapPlugin = function(value) { return value && (value.default || value); };
        const vscodemarkdownItKatex = unwrapPlugin(window.markdownItKatex);
        const markdownItTaskLists = unwrapPlugin(window.markdownitTaskLists);
        const Base64 = { decode: function(value) {
          const binary = atob(value);
          const bytes = Uint8Array.from(binary, function(c) { return c.charCodeAt(0); });
          if (typeof window.TextDecoder === 'function') return new window.TextDecoder('utf-8').decode(bytes);
          // Android WebView versions without TextDecoder still get a UTF-8-safe fallback.
          let encoded = '';
          for (let i = 0; i < bytes.length; i++) encoded += '%' + ('00' + bytes[i].toString(16)).slice(-2);
          try { return decodeURIComponent(encoded); } catch (__) { return binary; }
        } };
        if (!MarkdownIt || !window.katex || !vscodemarkdownItKatex || !markdownItTaskLists || !window.hljs || !window.mermaid) throw new Error('Local HTML preview dependency missing');

        // Configure markdown-it
        const md = new MarkdownIt({
            html: true,         // Enable HTML tags in source
            xhtmlOut: false,    // Use '/' to close single tags (<br />)
            breaks: false,      // Convert '\n' in paragraphs into <br>
            langPrefix: 'language-',  // CSS language prefix for fenced blocks
            linkify: true,      // Autoconvert URL-like text to links
            typographer: true,  // Enable some language-neutral replacement + quotes beautification
            quotes: '“”‘’',     // Quote chars
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs"><code>' +
                               hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                               '</code></pre>';
                    } catch (__) {}
                }
                return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        });

        // Add plugins
        // 传入已加载 mhchem 扩展的 katex 实例, 否则插件会使用其内部自带的另一个 katex 实例,
        // 导致 \ce 等 mhchem 语法无法识别 (Undefined control sequence: \ce)
        md.use(vscodemarkdownItKatex, { katex });

        md.use(markdownItTaskLists, {
            enabled: true,
            label: true,
            labelAfter: true
        });

        // Add custom renderer for mermaid
        const defaultFenceRenderer = md.renderer.rules.fence || function(tokens, idx, options, env, renderer) {
            return renderer.renderToken(tokens, idx, options);
        };

        md.renderer.rules.fence = function(tokens, idx, options, env, renderer) {
            const token = tokens[idx];
            const info = token.info ? md.utils.unescapeAll(token.info).trim() : '';

            if (info === 'mermaid') {
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                return `<div class="mermaid" id="${id}">${md.utils.escapeHtml(token.content.trim())}</div>\n`;
            }

            return defaultFenceRenderer(tokens, idx, options, env, renderer);
        };

        // Configure mermaid
        const prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({
            startOnLoad: false,
            theme: prefersDark ? 'dark' : 'default',
            securityLevel: 'loose',
            fontFamily: 'inherit'
        });

        // The markdown content to render (base64 encoded)
        const markdownBase64 = `{{MARKDOWN_BASE64}}`;
        let markdownContent = Base64.decode(markdownBase64);

        // Convert \[ ... \] to $$ ... $$ for LaTeX block math
        markdownContent = markdownContent.replace(/\\\[([\s\S]*?)\\\]/g, (match, content) => {
            return '\n$$\n' + content.trim() + '\n$$\n';
        });
        // Convert \( ... \) to $ ... $ for LaTeX inline math
        markdownContent = markdownContent.replace(/\\\(([\s\S]*?)\\\)/g, '$$$1$$');

        // Render markdown with markdown-it
        async function renderMarkdown() {
            try {
                // Process with markdown-it
                const html = md.render(markdownContent);
                document.getElementById('content').innerHTML = html;

                // Render mermaid diagrams
                const mermaidElements = document.querySelectorAll('.mermaid');
                if (mermaidElements.length > 0) {
                    // A failed diagram must not prevent the remaining text,
                    // equations and diagrams from becoming usable.
                    await Promise.all(Array.from(mermaidElements).map(async function(element) {
                        try { await mermaid.run({ nodes: [element] }); }
                        catch (error) {
                            element.textContent = '图形渲染失败，请检查 Mermaid 语法。';
                            element.classList.remove('mermaid');
                            console.warn(error);
                        }
                    }));
                }

                // Render KaTeX math
                document.querySelectorAll('.math.inline').forEach(el => {
                    try {
                        katex.render(el.textContent, el, {
                            throwOnError: false,
                            errorColor: '#cc0000',
                            trust: true
                        });
                    } catch (e) {
                        console.warn('KaTeX inline render error:', e);
                    }
                });

                document.querySelectorAll('.math.block').forEach(el => {
                    try {
                        katex.render(el.textContent, el, {
                            displayMode: true,
                            throwOnError: false,
                            errorColor: '#cc0000',
                            trust: true
                        });
                    } catch (e) {
                        console.warn('KaTeX block render error:', e);
                    }
                });

                // Handle external links
                document.querySelectorAll('a[href^="http"]').forEach(link => {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                });
                clearTimeout(window.rikkaPreviewTimer);
                window.__rikkaRenderStatus = 'ready';
                document.getElementById('preview-status').hidden = true;
            } catch (error) {
                clearTimeout(window.rikkaPreviewTimer);
                window.rikkaPreviewFailure(error);
            }
        }

        // Call the render function
        renderMarkdown();
      } catch (error) { clearTimeout(window.rikkaPreviewTimer); window.rikkaPreviewFailure(error); } })();
    </script>
</body>
</html>
