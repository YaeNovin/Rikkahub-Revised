// Keep synthetic music contexts separate from the user's QA and release data.
gradle.beforeProject { project ->
    project.extensions.extraProperties.set('kotlin.compiler.execution.strategy', 'in-process')
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.buildTypes.getByName('debug').applicationIdSuffix = '.revised.musicqa'
            }
        }
    }
}
