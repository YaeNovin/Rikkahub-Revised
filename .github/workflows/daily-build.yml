name: Daily Build

on:
  # 每天 UTC 18:00 触发（北京时间次日 02:00），可按需修改
  schedule:
    - cron: '0 18 * * *'
  # 也支持手动触发
  workflow_dispatch:
  # Workflow、签名构建配置或文档解析模块变更时立即自检一次
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-build.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'document/**'

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发或构建配置推送时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$KEY_BASE64" ] || [ -z "$SIGNING_CONFIG" ]; then
            echo "::error::KEY_BASE64 or SIGNING_CONFIG is not configured"
            exit 1
          fi

          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          if [ ! -s app/app.key ]; then
            echo "::error::Decoded signing key is empty"
            exit 1
          fi

          # Secrets copied from Windows may contain CRLF; carriage returns break passwords and aliases.
          printf '%s\n' "$SIGNING_CONFIG" | tr -d '\r' > local.properties
          for key in storePassword keyAlias keyPassword; do
            if ! grep -Eq "^${key}=.+" local.properties; then
              echo "::error::SIGNING_CONFIG is missing ${key}"
              exit 1
            fi
          done

          # The key is always decoded into app/app.key. Ignore stale paths from older machines.
          sed -i '/^storeFile=/d' local.properties
          printf '%s\n' 'storeFile=app.key' >> local.properties

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Validate Release R8
        run: |
          chmod +x gradlew
          ./gradlew :app:minifyReleaseWithR8 --no-configuration-cache

      - name: Gradle Build
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Prepare nightly release
        run: |
          set -euo pipefail

          previous_nightly=""
          if git rev-parse --verify refs/tags/nightly >/dev/null 2>&1; then
            previous_nightly="$(git rev-parse refs/tags/nightly)"
          fi

          if [ -n "$previous_nightly" ] && git merge-base --is-ancestor "$previous_nightly" "$GITHUB_SHA"; then
            git log --format='- %s' "${previous_nightly}..${GITHUB_SHA}" > nightly-release-notes.md
          fi
          if [ ! -s nightly-release-notes.md ]; then
            git log -1 --format='- %s' "$GITHUB_SHA" > nightly-release-notes.md
          fi

          # nightly is intentionally mutable and must identify the commit that produced the APKs.
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Nightly Build
          prerelease: true
          body_path: nightly-release-notes.md
          files: app/build/outputs/apk/release/*.apk
